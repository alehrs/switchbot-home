apiVersion: v1
kind: ConfigMap
metadata:
  name: switchbot-home-backend-config
  namespace: switchbot-home
data:
  DATABASE_URL: "sqlite:///data/switchbot-home.sqlite"
  # Not :3000 — with hostNetwork this binds directly on the node, and on
  # the maintainer's own homelab node :3000 is already taken by Grafana
  # (confirmed via `ss -tln` before the first real deploy, not guessed).
  BIND_ADDRESS: "0.0.0.0:8090"
  # At most one stored reading per device per 30s. Without this every
  # ADV_IND (a few per second per meter) is a row — ~14k rows in the
  # first day on this deploy.
  READING_INTERVAL_SECONDS: "30"
  # Pin the TP-Link UB500 by its physical USB vendor/product IDs. Its hciN
  # number can change (it is currently hci2), and BlueZ reports its
  # modalias as the generic root hub rather than the dongle's own ID.
  BLE_ADAPTER: "usb:2357:0604"
  # Delete readings older than N days (checked hourly). Left off: keep
  # everything for now. Uncomment and redeploy to enable.
  # RETENTION_DAYS: "300"
