name: Deploy backend to homelab

# Runs on a self-hosted runner installed on the homelab itself (outbound-
# only connection to GitHub, no inbound port opened on the home network —
# see docs/specs/installation-and-deployment.md §8). Pushes to the
# homelab's own existing local registry (registry.local:5000) rather than
# importing directly into k3s's containerd — confirmed against the real
# homelab that image import needs root and this runner's user (multivac)
# doesn't have passwordless sudo, while a registry push needs none: the
# runner's Docker credentials for registry.local:5000 are already
# configured on the host (the same account the other repos' pipelines use).
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "deploy/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/deploy-backend.yml"

jobs:
  deploy:
    runs-on: [self-hosted, homelab]
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -f deploy/docker/Dockerfile -t registry.local:5000/switchbot-home-backend:${{ github.sha }} -t registry.local:5000/switchbot-home-backend:latest .

      - name: Push image to the homelab registry
        run: |
          docker push registry.local:5000/switchbot-home-backend:${{ github.sha }}
          docker push registry.local:5000/switchbot-home-backend:latest

      - name: Apply manifests
        run: kubectl apply -f deploy/k3s/

      - name: Roll out new image
        run: |
          kubectl set image deployment/switchbot-home-backend backend=registry.local:5000/switchbot-home-backend:${{ github.sha }} -n switchbot-home
          kubectl rollout status deployment/switchbot-home-backend -n switchbot-home --timeout=120s
