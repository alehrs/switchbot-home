name: Claude PR Review
on:
  pull_request:
    types: [opened, synchronize]
permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: write
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: anthropics/claude-code-action@70a6e5256e9e2366a1ed5c041904a982ba3a328f # v1.0.135
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          github_token: ${{ github.token }}
          prompt: |
            Review this PR as a senior maintainer of this repository.

            ## Preparation

            Before writing any comments, do the following:
            1. Inspect the surrounding code and identify the patterns used in
               adjacent files, similar components, services, tests, and modules.
            2. Read `AGENTS.md` and treat it as the authoritative source for
               repository-specific conventions, rules, and approved patterns.
            3. Check the PR's existing review comments and threads (for example
               via `gh pr view --json comments,reviews` or `gh api graphql` for
               thread resolution status) to see what was already raised in a
               previous pass on this PR.

            ## What counts as a reviewable issue

            Leave a comment only when something falls into one of these
            categories. Repository consistency matters more than generic
            software engineering advice.
            1. Inconsistency with existing repository patterns.
            2. Inconsistency with naming, structure, architecture, or coding
               style already used in nearby files.
            3. A violation of an established project convention, including
               AGENTS.md.
            4. A readability or maintainability issue that is genuinely
               significant, not a nit.
            5. A bug, edge case, or correctness issue.

            ## What to skip entirely

            Generated, vendored, or lock files, even if they appear in the
            diff (for example package-lock.json, yarn.lock, pnpm-lock.yaml,
            anything under vendor/, dist/, or build/, and any file carrying a
            "generated" or "do not edit" header).

            ## What never to comment on

            - Introducing new libraries or dependencies.
            - Adopting new architectural patterns.
            - Large refactors unrelated to the PR.
            - Alternative implementations, unless the current one is clearly
              incorrect.
            - Stylistic preferences that differ from existing repository
              conventions.
            - Formatting changes already handled by tooling.
            - Minor nits or speculative improvements.
            - Comments that only acknowledge or praise a fix, a correct
              implementation, or good practice. If something is fine, say
              nothing, silence is the confirmation.

            ## Substantiating a pattern violation

            When flagging an inconsistency with existing repository patterns
            (this does not apply to bugs, edge cases, or correctness issues),
            name what you are comparing against: either 1 to 3 concrete files
            that demonstrate the pattern, or the specific AGENTS.md rule if the
            convention comes from there rather than from surrounding code.

            ## Handling issues from a previous review pass

            For each issue already raised in a previous review pass on this PR:
            - If the relevant code is unchanged and the thread is still open,
              do not open a new duplicate comment for it. List it as an
              outstanding unresolved item in the final summary instead.
            - If the relevant code has since changed, review the fix as part
              of this pass like any other part of the diff: check whether it
              actually resolves the issue rather than assuming it does because
              it was touched.
            - If the developer replied with a justification instead of
              changing the code, evaluate whether that justification is
              valid. If it holds up, treat the issue as resolved and do not
              re-raise it. If it does not, leave a follow-up comment
              explaining why the justification does not address the concern.

            ## Output

            For each issue, create an inline comment on the relevant diff line.

            After reviewing, post a short summary containing:
            - whether the PR follows repository patterns
            - any major concerns
            - any unresolved issues carried over from previous review passes
              on this PR
            - approval recommendation
          claude_args: "--model claude-sonnet-5 --allowedTools mcp__github_inline_comment__create_inline_comment,Bash --max-turns 40"